<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video/Audio Recorder and Player</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>🎥🎙️ Media Recorder & Player</h1>
        <p>Record and Play Videos & Audios Easily!</p>
    </header>
    <div class="container">
        <h1>Record & Play Media</h1>

        <div class="recording-section">
            <h2>Recording</h2>
            <div class="video-preview-box" id="video-preview-box">
                <video id="preview" muted autoplay></video>
            </div>
            <button id="record-video">🎥 Record Video</button>
            <button id="record-audio">🎙️ Record Audio</button>
            <button id="stop-record" disabled>⏹️ Stop Recording</button>
        </div>
        <div class="playback-section">
            <h2>Playback</h2>
            <div class="video-playback-container" style="position: relative;">
                <video id="playback-video" controls></video>
                <div id="skip-effect" class="skip-effect"></div> 
            </div>
            <div class="video-controls">
                <button id="play-video">▶️ Play</button>
                <button id="pause-video">⏸️ Pause</button>
                <button id="fast-forward">⏩ Fast Forward (+10s)</button>
                <button id="rewind">⏪ Rewind (-10s)</button>
            </div>
            <audio id="playback-audio" controls></audio>
            <div class="audio-controls">
                <button id="download-video">📥 Download Video</button>
                <button id="download-audio">📥 Download Audio</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
